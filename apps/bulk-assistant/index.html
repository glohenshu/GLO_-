<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新規一括集中アシスタント</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <h1>新規一括集中アシスタント <span class="ver">Ver.0.1</span></h1>

    <!-- 再掲連載アシスタントと違い、このアプリはkintoneを見ない。
         一括集中はMWで採番した記事IDを手元に持って作業するため、
         カテゴリコードの取得欄は置かない -->
    <div class="search-row">
      <span class="note">記事IDとタイトルを入力して、前回記事リンクのHTMLを作ります</span>
    </div>
  </div>
</header>

<main class="content">

  <!-- ============================================================
       タブ
       ②以降を足す前提で、1タブでもタブの形にしておく
       ============================================================ -->
  <section id="section-tabs" class="block">

    <div class="tabs" role="tablist">
      <button type="button" class="tab is-active" id="tab-prev"
              role="tab" aria-selected="true" aria-controls="panel-prev"
              data-tab="prev">① 前回記事リンク作成</button>
    </div>

    <!-- ---- ① 前回記事リンク作成 ---- -->
    <div class="tabpanel" id="panel-prev" role="tabpanel" aria-labelledby="tab-prev">

      <div class="next-settings">
        <div class="next-field">
          <label class="count-label" id="prev-count-label">回数</label>

          <div class="count-control" role="group" aria-labelledby="prev-count-label">
            <button type="button" id="prev-count-minus" class="step"
                    aria-label="回数を1回減らす">−</button>
            <input id="prev-count" class="count-input mono" type="text"
                   inputmode="numeric" autocomplete="off" spellcheck="false"
                   aria-label="回数">
            <button type="button" id="prev-count-plus" class="step"
                    aria-label="回数を1回増やす">＋</button>
            <span class="count-unit">回</span>
          </div>

          <span class="note">作る本数を入れると、その回数ぶんの行を作ります</span>
        </div>
      </div>

      <div class="bulk">
        <label for="bulk-input">記事IDを一括貼り付け</label>
        <textarea id="bulk-input" rows="4" spellcheck="false"
                  placeholder="30001&#10;30002&#10;30003"></textarea>
        <div class="bulk-actions">
          <button type="button" id="bulk-apply" class="primary small">各回に反映</button>
          <button type="button" id="bulk-clear" class="copy mini">記事IDをすべて消す</button>
          <span id="bulk-status" class="note"></span>
        </div>
      </div>

      <dl class="hint hint-defs">
        <dt>前回記事</dt>
        <dd>1つ前の回の記事ID・記事タイトルを使います。第1回には前回が無いのでコピーボタンを置きません。</dd>

        <dt>記事タイトル</dt>
        <dd>任意です。未入力のままでもコピーでき、そのときHTMLには <code>●▼■</code> が入ります。</dd>

        <dt>コピー済み ✓</dt>
        <dd>どの回まで作ったか分かるよう、回ごとに残します。前の回の入力を直すとHTMLが変わるので自動で外れます。</dd>
      </dl>

      <table class="grid grid-prev">
        <thead>
          <tr>
            <th class="col-ep">回</th>
            <th class="col-id">今回の記事ID</th>
            <th class="col-title">今回の記事タイトル</th>
            <th class="col-prev">前回記事</th>
            <th class="col-act">操作</th>
          </tr>
        </thead>
        <tbody id="prev-body"></tbody>
      </table>

    </div>

  </section>

</main>

<div id="toast" class="toast" role="status"></div>

<script src="app.js"></script>
</body>
</html>
